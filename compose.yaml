services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: webex_assistant
      POSTGRES_USER: webex_assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webex_assistant -d webex_assistant"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["webex-knowledge-assistant", "migrate"]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://webex_assistant:${POSTGRES_PASSWORD}@postgres/webex_assistant
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://webex_assistant:${POSTGRES_PASSWORD}@postgres/webex_assistant
      KNOWLEDGE_MANIFEST: /app/examples/knowledge/sample-manifest.json
      WEBEX_WEBHOOK_SECRET: ${WEBEX_WEBHOOK_SECRET:?set WEBEX_WEBHOOK_SECRET}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: ["webex-knowledge-assistant", "worker"]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://webex_assistant:${POSTGRES_PASSWORD}@postgres/webex_assistant
      KNOWLEDGE_MANIFEST: /app/examples/knowledge/sample-manifest.json
      ALLOWED_WEBEX_SPACE_IDS: ${ALLOWED_WEBEX_SPACE_IDS:?set ALLOWED_WEBEX_SPACE_IDS}
      ALLOWED_WEBEX_PERSON_IDS: ${ALLOWED_WEBEX_PERSON_IDS:-}
      ALLOW_DIRECT_MESSAGES: ${ALLOW_DIRECT_MESSAGES:-false}
      REQUIRE_MENTION: ${REQUIRE_MENTION:-true}
      WEBEX_BOT_PERSON_ID: ${WEBEX_BOT_PERSON_ID:?set WEBEX_BOT_PERSON_ID}
      WEBEX_BOT_TOKEN: ${WEBEX_BOT_TOKEN:?set WEBEX_BOT_TOKEN}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
